<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profiles Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-top: 0;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.delete-btn {
    background: #d32f2f;
}

.card {
    background: white;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 14px 16px;

    cursor: pointer;

    background: #ececec;
    font-weight: bold;
    user-select: none;
}

.card-header:hover {
    background: #e0e0e0;
}

.card-body {
    padding: 15px;
}

.field {
    margin-bottom: 12px;
}

label {
    display: block;
    margin-bottom: 4px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.links-container {
    margin-top: 10px;
}

.link-row {
    display: grid;
    grid-template-columns: 1fr 2fr auto;
    gap: 10px;
    margin-bottom: 8px;
}

.actions {
    margin-top: 15px;
}

.status {
    margin-top: 10px;
    color: green;
}

.search-box {
    margin-bottom: 15px;
}

.search-box input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
}

.small-text {
    color: #666;
    font-size: 12px;
}

@media (max-width: 700px) {

    .link-row {
        grid-template-columns: 1fr;
    }

}
</style>
</head>
<body>

<div class="container">

    <h1>Profiles Editor</h1>

    <div class="toolbar">
        <button id="reloadBtn">Reload JSON</button>
        <button id="addBtn">Add Person</button>
        <button id="downloadBtn">Download JSON</button>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search by name..."
        >
    </div>

    <div id="status" class="status"></div>

    <div id="profilesContainer"></div>

</div>

<script>

let profiles = [];
let searchFilter = "";

const expandedProfiles = new Set();

/* --------------------------------------------------
   Helpers
-------------------------------------------------- */

function escapeHtml(str) {

    return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function setStatus(text) {

    document
        .getElementById("status")
        .textContent = text;

}

function generateUniqueId() {

    let id;

    do {

        id =
            "p_" +
            Math.random()
                .toString(36)
                .substring(2, 10);

    } while (
        profiles.some(
            profile => profile.id === id
        )
    );

    return id;

}

/* --------------------------------------------------
   Fetch
-------------------------------------------------- */

async function loadProfiles() {

    try {

        const response = await fetch(
            `/profiles.json?t=${Date.now()}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "Unable to load profiles.json"
            );
        }

        profiles = await response.json();

        profiles.forEach(profile => {

            if (!profile.id) {
                profile.id =
                    generateUniqueId();
            }

            if (!profile.links) {
                profile.links = [];
            }

        });

        renderProfiles();

        setStatus(
            `Loaded ${profiles.length} profiles`
        );

    } catch (err) {

        console.error(err);

        setStatus(
            "Failed to load profiles.json"
        );

    }

}

/* --------------------------------------------------
   Render
-------------------------------------------------- */

function renderProfiles() {

    const container =
        document.getElementById(
            "profilesContainer"
        );

    container.innerHTML = "";

    profiles.sort((a, b) =>
        (a.name || "")
            .localeCompare(
                b.name || ""
            )
    );

    const filteredProfiles =
        profiles.filter(profile =>
            (profile.name || "")
                .toLowerCase()
                .includes(
                    searchFilter.toLowerCase()
                )
        );

    filteredProfiles.forEach(profile => {

        const profileIndex =
            profiles.indexOf(profile);

        const expanded =
            expandedProfiles.has(
                profile.id
            );

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div
                class="card-header"
                onclick="toggleProfile('${profile.id}')"
            >

                <span>
                    ${
                        escapeHtml(
                            profile.name ||
                            "(Unnamed Person)"
                        )
                    }
                </span>

                <span>
                    ${expanded ? "▼" : "▶"}
                </span>

            </div>

            ${
                expanded
                ? `
                <div class="card-body">

                    <div class="field">
                        <label>ID</label>
                        <input
                            readonly
                            value="${escapeHtml(profile.id)}"
                        >
                        <div class="small-text">
                            Automatically generated
                        </div>
                    </div>

                    <div class="field">
                        <label>Name</label>
                        <input
                            value="${escapeHtml(profile.name || "")}"
                            oninput="
                                profiles[${profileIndex}].name=this.value;
                            "
                        >
                    </div>

                    <div class="field">
                        <label>Picture Filename</label>
                        <input
                            value="${escapeHtml(profile.picture || "")}"
                            oninput="
                                profiles[${profileIndex}].picture=this.value;
                            "
                        >
                    </div>

                    <div class="field">
                        <label>Description</label>
                        <textarea
                            oninput="
                                profiles[${profileIndex}].description=this.value;
                            "
                        >${escapeHtml(profile.description || "")}</textarea>
                    </div>

                    <div class="links-container">

                        <h3>Links</h3>

                        <div id="links-${profileIndex}">
                            ${renderLinks(profileIndex)}
                        </div>

                        <button
                            onclick="event.stopPropagation();addLink(${profileIndex})"
                        >
                            Add Link
                        </button>

                    </div>

                    <div class="actions">

                        <button
                            class="delete-btn"
                            onclick="event.stopPropagation();deleteProfile(${profileIndex})"
                        >
                            Delete Person
                        </button>

                    </div>

                </div>
                `
                : ""
            }

        `;

        container.appendChild(card);

    });

}

/* --------------------------------------------------
   Links
-------------------------------------------------- */

function renderLinks(profileIndex) {

    const profile =
        profiles[profileIndex];

    return (profile.links || [])
        .map((link, linkIndex) => `

        <div class="link-row">

            <input
                placeholder="Title"
                value="${escapeHtml(link.title || "")}"
                oninput="
                    profiles[${profileIndex}]
                    .links[${linkIndex}]
                    .title=this.value
                "
            >

            <input
                placeholder="URL"
                value="${escapeHtml(link.url || "")}"
                oninput="
                    profiles[${profileIndex}]
                    .links[${linkIndex}]
                    .url=this.value
                "
            >

            <button
                class="delete-btn"
                onclick="
                    event.stopPropagation();
                    removeLink(
                        ${profileIndex},
                        ${linkIndex}
                    )
                "
            >
                X
            </button>

        </div>

    `)
    .join("");

}

function addLink(profileIndex) {

    profiles[profileIndex].links.push({
        title: "",
        url: ""
    });

    renderProfiles();

}

function removeLink(
    profileIndex,
    linkIndex
) {

    profiles[profileIndex]
        .links
        .splice(linkIndex, 1);

    renderProfiles();

}

/* --------------------------------------------------
   Profiles
-------------------------------------------------- */

function addProfile() {

    const profile = {

        id: generateUniqueId(),

        name: "",

        description: "",

        picture: "",

        links: []

    };

    profiles.push(profile);

    expandedProfiles.add(profile.id);

    renderProfiles();

}

function deleteProfile(index) {

    if (
        !confirm(
            "Delete this profile?"
        )
    ) {
        return;
    }

    expandedProfiles.delete(
        profiles[index].id
    );

    profiles.splice(index, 1);

    renderProfiles();

}

function toggleProfile(id) {

    if (
        expandedProfiles.has(id)
    ) {

        expandedProfiles.delete(id);

    } else {

        expandedProfiles.add(id);

    }

    renderProfiles();

}

/* --------------------------------------------------
   Download
-------------------------------------------------- */

function downloadJSON() {

    const output = JSON.stringify(
        profiles,
        null,
        2
    );

    const blob =
        new Blob(
            [output],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "profiles.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    setStatus(
        "Downloaded profiles.json"
    );

}

/* --------------------------------------------------
   Events
-------------------------------------------------- */

document
    .getElementById("reloadBtn")
    .addEventListener(
        "click",
        loadProfiles
    );

document
    .getElementById("addBtn")
    .addEventListener(
        "click",
        addProfile
    );

document
    .getElementById("downloadBtn")
    .addEventListener(
        "click",
        downloadJSON
    );

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        e => {

            searchFilter =
                e.target.value;

            renderProfiles();

        }
    );

/* --------------------------------------------------
   Start
-------------------------------------------------- */

loadProfiles();

</script>

</body>
</html>
